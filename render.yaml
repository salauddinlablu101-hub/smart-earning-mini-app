services:
  - type: web
    name: telegram-earning-miniapp
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
